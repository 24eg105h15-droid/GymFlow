services:
  - type: web
    name: gymflow-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: GYMFLOW_DB_HOST
        sync: false
      - key: GYMFLOW_DB_PORT
        sync: false
      - key: GYMFLOW_DB_NAME
        value: defaultdb
      - key: GYMFLOW_DB_USERNAME
        sync: false
      - key: GYMFLOW_DB_PASSWORD
        sync: false
      - key: GYMFLOW_JWT_SECRET
        generateValue: true
      - key: GYMFLOW_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: GYMFLOW_SHOW_SQL
        value: "false"
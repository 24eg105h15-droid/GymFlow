spring.application.name=gymflow-api
server.port=${PORT:8080}

# Aiven for MySQL connection settings. These values must be set in the same terminal
# that starts the Spring Boot app.
spring.datasource.url=jdbc:mysql://${GYMFLOW_DB_HOST}:${GYMFLOW_DB_PORT}/${GYMFLOW_DB_NAME:defaultdb}?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${GYMFLOW_DB_USERNAME:avnadmin}
spring.datasource.password=${GYMFLOW_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${GYMFLOW_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${GYMFLOW_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

gymflow.jwt.secret=${GYMFLOW_JWT_SECRET:Z3ltZmxvdy1kZXZlbG9wbWVudC1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcw==}
gymflow.cors.allowed-origins=${GYMFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app}
